name: ci
on:
  push:
    branches: [main, builder-fixes]  # TEMP: remove builder-fixes before merging
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - name: Install gitleaks, scan history, install hooks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner .
          tools/install-hooks.sh
      - name: Fixture ingest + verify (goldens, freshness, features)
        run: |
          export FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed"
          python3 tools/brain.py --root tests/fixtures/vault ingest
          python3 tools/brain.py --root tests/fixtures/vault verify
      - name: Empty user vault (skeleton) ingests and verifies with no evals
        run: |
          export FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed"
          python3 tools/brain.py ingest
          python3 tools/brain.py verify | tee /tmp/v.txt
          grep -q "run: python3 tools/brain.py evals init" /tmp/v.txt
      - name: evals init / accept on the fixture
        run: FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed" python3 tools/test_evals.py
      - name: MCP end-to-end
        run: FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed" python3 tools/test_mcp.py
      - name: README bench table matches the code
        run: |
          FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed" python3 tools/bench.py
          git diff --exit-code README.md
