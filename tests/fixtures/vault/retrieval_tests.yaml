# Goldens: a query and the note that must answer it.
# expect_path + max_rank, reject_path (must not appear), expect_empty (no-answer).
recall_at_5_floor: 0.9
goldens:
  - {id: person-ari, query: "Ari Novak", expect_path: people/ari-novak.md, max_rank: 1}
  - {id: person-dana-lex, mode: lexical, query: "Dana Okafor", expect_path: people/dana-okafor.md, max_rank: 1}
  - {id: who-supplies-flour, query: "who supplies our flour", expect_path: people/ari-novak.md, max_rank: 3}
  - {id: order-deadline, query: "when do flour orders need to be placed", expect_path: people/ari-novak.md, max_rank: 3}
  - {id: bookkeeping, query: "who reconciles the accounts each month", expect_path: people/dana-okafor.md, max_rank: 3}
  - {id: oven-budget, query: "how much can we spend on the new oven", expect_path: projects/new-oven.md, max_rank: 3}
  - {id: oven-next, mode: lexical, query: "electrical panel", expect_path: projects/new-oven.md, max_rank: 1}
  - {id: market-plan, query: "farmers market Wednesday stall", expect_path: projects/farmers-market.md, max_rank: 3}
  - {id: hours-current, query: "what are the opening hours", expect_path: decisions/2026-03-01-opening-hours.md, max_rank: 1}
  - {id: hours-nl-lexical, mode: lexical, query: "what time does the bakery open on Tuesday", expect_path: decisions/2026-03-01-opening-hours.md, max_rank: 3}
  - {id: pricing, query: "how much is a sourdough loaf", expect_path: decisions/2026-02-01-pricing.md, max_rank: 3}
  - {id: food-cost-goal, query: "food cost target", expect_path: GOALS.md, max_rank: 3}
  - {id: who-writes, query: "who is allowed to write canon notes", expect_path: GOALS.md, max_rank: 3}
  # log/ and inbox/ are never indexed, so a reject_path on them could never fail; answer-level checks below cover leaks.
  - {id: none-nonsense, mode: lexical, query: "zxqv blorptastic", expect_empty: true}
  - {id: none-semantic, mode: semantic, query: "quantum chromodynamics lattice gauge theory", expect_empty: true}
  # Answer level: cite-and-verify must quote the line that states the fact (expect_cite = path:line), or say "I don't know".
  - {id: cite-hours, query: "what are the opening hours", expect_known: true, expect_cite: "decisions/2026-03-01-opening-hours.md:8"}
  - {id: cite-price, query: "how much is a sourdough loaf", expect_known: true, expect_cite: "decisions/2026-02-01-pricing.md:8"}
  - {id: cite-books, query: "who reconciles the accounts each month", expect_known: true, expect_cite: "people/dana-okafor.md:7"}
  - {id: cite-food-cost, query: "food cost target", expect_known: true, expect_cite: "GOALS.md:10"}
  - {id: cite-flour-day, query: "which day is flour delivered", expect_known: true, expect_cite: "people/ari-novak.md:7"}
  - {id: idk-off-topic, query: "what is the capital of Peru", expect_known: false}
  - {id: idk-not-in-vault, query: "what is the employee dental plan", expect_known: false}
  - {id: idk-owner-attr, query: "what is Dana Okafor's passport number", expect_known: false}
  # Wrong answers found 2026-10-29 (a word "close enough" by embedding stood in for the asked one): right line or I don't know
  - {id: idk-bakery-phone, query: "what is the bakery's phone number", expect_known: false}
  - {id: idk-bakery-owner, query: "who owns the bakery", expect_known: false}
  - {id: cite-flour-order-time, query: "when do flour orders need to be placed", expect_known: true, allow_idk: true, expect_cite: "people/ari-novak.md:8"}
  - {id: cite-bakery-sells, query: "what does the bakery sell", expect_known: true, allow_idk: true, expect_cite: "decisions/2026-02-01-pricing.md:8"}
  # Answer check (2026-10-29): the line must state an answer of the asked kind, or "I don't know"
  - {id: idk-check-email, query: "what is Ari Novak's email address", expect_known: false}
  - {id: idk-check-phone, query: "what is Dana Okafor's phone number", expect_known: false}
  - {id: idk-check-date, query: "what did the 2026-01-20 pricing decision set", expect_known: false}
  - {id: cite-check-revisit, query: "when should the single flour supplier decision be revisited", expect_known: true, expect_cite: "decisions/2026-02-15-supplier.md:9"}
